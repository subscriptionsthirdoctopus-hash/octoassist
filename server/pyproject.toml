[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octoassist-server"
version = "0.1.0"
description = "OctoAssist ITSM server — receives agent check-ins and serves admin UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
]

[tool.setuptools]
packages = ["app", "app.api", "app.web"]
