{% extends "base.html" %}
{% block title %}Sign in — OctoAssist{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Sign in to OctoAssist</h1>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Email
      <input type="text" name="email" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="primary">Sign in</button>
  </form>
  <p class="meta">Need an account? Ask your OctoAssist administrator to provision one.</p>
</section>
{% endblock %}
