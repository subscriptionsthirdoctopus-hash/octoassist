name: Deploy Server

# One-click deploy of the server to the production droplet. It runs exactly
# what an operator otherwise runs by hand from a Mac with the deploy key
# (deploy/docker/README.md, "Operate"): copy this checkout to
# /opt/octoassist, rebuild the app image, restart the app container, and
# confirm /health answers — first on the droplet's loopback port, then on
# the public hostname. Manual trigger only; nothing deploys on push.
#
# Needs one repository secret, DROPLET_SSH_KEY: the private key the droplet's
# root account trusts (the ~/.ssh/octoassist_deploy key). Everything stateful
# on the droplet is left alone: deploy/docker/.env, uploads/, backups/, bin/
# and the Postgres volume.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy"
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  DROPLET_HOST: 68.183.246.16

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Repository secret DROPLET_SSH_KEY is not set. Add the private key the droplet trusts (the octoassist_deploy key) under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Normalise CRLF and surrounding whitespace, then write the key.
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validate the secret before touching the droplet, without revealing it.
          lines=$(wc -l < ~/.ssh/deploy_key)
          first=$(head -c 40 ~/.ssh/deploy_key)
          case "$first" in
            ssh-ed25519*|ssh-rsa*|ecdsa-*)
              echo "::error::DROPLET_SSH_KEY holds a PUBLIC key (starts with '${first%% *}'). Paste the PRIVATE key instead: the file without .pub, starting with '-----BEGIN ... PRIVATE KEY-----'."
              exit 1 ;;
            -----BEGIN*) ;;
            *)
              echo "::error::DROPLET_SSH_KEY does not look like a private key (no '-----BEGIN ... PRIVATE KEY-----' header, $lines line(s)). Paste the full contents of the private key file, including the BEGIN and END lines."
              exit 1 ;;
          esac
          if [ "$lines" -lt 3 ]; then
            echo "::error::DROPLET_SSH_KEY is on $lines line(s); the line breaks were lost when pasting. Re-copy with 'cat ~/.ssh/octoassist_deploy | pbcopy' and paste again."
            exit 1
          fi
          if ! out=$(ssh-keygen -y -P '' -f ~/.ssh/deploy_key 2>&1); then
            case "$out" in
              *passphrase*)
                echo "::error::DROPLET_SSH_KEY is protected by a passphrase, which an unattended deploy cannot enter. Create a passphrase-free deploy key (ssh-keygen -t ed25519 -N '' -f ~/.ssh/octoassist_deploy_ci), add its .pub to /root/.ssh/authorized_keys on the droplet, and store that private key as the secret." ;;
              *)
                echo "::error::DROPLET_SSH_KEY failed to parse as a private key ($lines lines): ${out%%$'\n'*}. Re-copy the whole private key file and paste it again." ;;
            esac
            exit 1
          fi
          echo "deploy key parsed OK: ${out%% *} key, fingerprint $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          ssh-keyscan -t ed25519,rsa -H "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host droplet
            HostName $DROPLET_HOST
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ConnectTimeout 20
          EOF
          ssh droplet 'echo "connected to $(hostname) as $(whoami)"'

      - name: Sync code to /opt/octoassist
        run: |
          # Whole tree, additive: never deletes anything on the droplet.
          rsync -az \
            --exclude '.git' --exclude '__pycache__' --exclude '.venv' \
            --exclude '.env' --exclude 'uploads' --exclude 'backups' --exclude 'bin' \
            ./ droplet:/opt/octoassist/
          # The image inputs (server/Dockerfile copies these) are mirrored
          # exactly, so a module removed from the repo leaves the image too.
          rsync -az --delete --exclude '__pycache__' \
            server/app/ droplet:/opt/octoassist/server/app/
          rsync -az --delete --exclude '__pycache__' \
            agent-py/ droplet:/opt/octoassist/agent-py/
          ssh droplet 'cd /opt/octoassist && echo "synced: $(ls server/app | wc -l) entries in server/app"'

      - name: Rebuild and restart the app
        run: |
          ssh droplet 'set -euo pipefail
            cd /opt/octoassist/deploy/docker
            echo "== building image"
            docker compose build --quiet app
            echo "== restarting app"
            docker compose up -d app
            echo "== waiting for /health on 127.0.0.1:8088"
            for i in $(seq 1 18); do
              if curl -fsS --max-time 5 http://127.0.0.1:8088/health >/dev/null 2>&1; then
                echo "app healthy after $((i*5))s"
                docker compose ps
                exit 0
              fi
              sleep 5
            done
            echo "::error::app did not become healthy within 90s"
            docker compose ps
            docker compose logs --tail=80 app
            exit 1'

      - name: Verify public health
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://octoassist.thirdoctopus.com/health || echo 000)
          echo "https://octoassist.thirdoctopus.com/health -> HTTP $code"
          [ "$code" = "200" ]
