name: Check Server

# The agent build workflow covers agent/ and agent-py/ only. Nothing exercised
# server/ at all, so a broken import or template would have shipped unnoticed.
# This job is the cheap insurance: it runs in well under a minute and needs no
# database, because every setting has a default and SQLAlchemy's create_engine
# is lazy.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  check-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Matches the Docker image (python:3.12-slim) — the lock file was
          # resolved for it.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.lock

      - name: Install Server Dependencies
        run: |
          python -m pip install --upgrade pip
          # Exactly what the image installs: the hash-pinned lock, then the
          # app without resolving anything else.
          pip install --require-hashes -r server/requirements.lock
          pip install --no-deps -e ./server
          # Pinned so a future ruff release cannot turn a green build red by
          # adding rules. Bump deliberately.
          pip install ruff==0.15.8 pytest==8.3.4

      # Error-class rules only: syntax errors (E9), undefined names (F821),
      # invalid comparisons (F63) and misused constructs (F7). Style is
      # deliberately not gated — the goal is to catch code that cannot run,
      # not to churn the existing codebase. Widen this selection when the team
      # is ready to act on it.
      - name: Lint (errors only)
        run: ruff check server/app --select E9,F63,F7,F82 --output-format concise

      # Compiles every Jinja template and forces every lazily-included FastAPI
      # route to resolve. See server/scripts/preflight.py for why each matters.
      - name: Preflight (templates + routes)
        run: python server/scripts/preflight.py

  # Renders every admin page against a real (empty) Postgres — the app seeds
  # its own admin on startup. Catches the class of bug preflight cannot: a
  # view that imports fine but fails at request time.
  smoke:
    runs-on: ubuntu-latest
    needs: check-server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: octoassist
          POSTGRES_USER: octoassist
          POSTGRES_PASSWORD: octoassist
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U octoassist -d octoassist"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements.lock
          pip install --no-deps -e ./server
          pip install pytest==8.3.4
      - name: Route smoke test
        env:
          OCTOASSIST_DATABASE_URL: postgresql+psycopg://octoassist:octoassist@localhost:5432/octoassist
        run: python -m pytest server/tests -q --no-header
