# OctoCred site config — /opt/hrms-erp/nginx/conf.d/octocred.conf
# Mounted into hrms-nginx at /etc/nginx/conf.d/octocred.conf

upstream octocred_upstream {
    server 172.18.0.1:8005;
    keepalive 16;
}

# ---------- HTTP :80 — ACME + redirect-everything-else to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name octocred.thirdoctopus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443 — main site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name octocred.thirdoctopus.com;

    ssl_certificate     /etc/nginx/ssl/octocred/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/octocred/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_OCTOCRED:50m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    include /etc/nginx/conf.d/security-headers.inc;

    client_max_body_size 10M;
    proxy_read_timeout 60s;

    access_log /var/log/nginx/octocred.access.log;
    error_log  /var/log/nginx/octocred.error.log;

    location / {
        proxy_pass http://octocred_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
