# Third Octopus static site configuration
# Mounted into hrms-nginx at /etc/nginx/conf.d/thirdoctopus.conf

# ---------- HTTP :80 — ACME + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name thirdoctopus.com www.thirdoctopus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443 — Main static site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thirdoctopus.com www.thirdoctopus.com;

    # SSL Certificates (Self-signed initially, then certbot)
    ssl_certificate     /etc/nginx/ssl/thirdoctopus/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/thirdoctopus/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_THIRD_OCTO:50m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header X-XSS-Protection "1; mode=block" always;

    root /var/www/html/thirdoctopus;
    index index.html;

    access_log /var/log/nginx/thirdoctopus.access.log;
    error_log  /var/log/nginx/thirdoctopus.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Contact form API
    location /api/contact {
        proxy_pass http://contact-api:3008/api/contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

# ---------- HTTP :8085 — IP / Preview listener ----------
server {
    listen 8085 default_server;
    listen [::]:8085 default_server;

    root /var/www/html/thirdoctopus;
    index index.html;

    access_log /var/log/nginx/thirdoctopus.preview.access.log;
    error_log  /var/log/nginx/thirdoctopus.preview.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Contact form API
    location /api/contact {
        proxy_pass http://contact-api:3008/api/contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
