# OctoFlow site config — /opt/hrms-erp/nginx/conf.d/octoflow.conf
# Mounted into hrms-nginx at /etc/nginx/conf.d/octoflow.conf
#
# Architecture (mirrors OctoAssist's setup):
#   client → :443 (hrms-nginx) → octoflow-app:8080 (over Docker bridge)
#
# Cert: Let's Encrypt for octoflow.thirdoctopus.com — issued via
#       `certbot certonly --standalone` and copied into the ssl mount.
#       Renewal handled by the host certbot.timer + the post-renew hook
#       at /etc/letsencrypt/renewal-hooks/deploy/octoflow-nginx.sh
#       (which re-copies the cert files and reloads hrms-nginx).

upstream octoflow_upstream {
    server octoflow-app:8080;
    keepalive 16;
}

# ---------- HTTP :80 — ACME + redirect-everything-else to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name octoflow.thirdoctopus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443 — main site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name octoflow.thirdoctopus.com;

    ssl_certificate     /etc/nginx/ssl/octoflow/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/octoflow/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_OCTOFLOW:50m;
    ssl_session_tickets off;

    # HSTS — six months, include subdomains. Comment this out if you ever
    # need to revert to HTTP, otherwise browsers cache it for 6 months.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    client_max_body_size 1024M;
    proxy_read_timeout 60s;

    access_log /var/log/nginx/octoflow.access.log;
    error_log  /var/log/nginx/octoflow.error.log;

    location / {
        proxy_pass http://octoflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
