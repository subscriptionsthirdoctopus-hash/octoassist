# OctoVault subdomain config — /opt/hrms-erp/nginx/conf.d/octovault.conf
# Mounted into hrms-nginx at /etc/nginx/conf.d/octovault.conf

# ---------- HTTP :80 — ACME + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name octovault.thirdoctopus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443 — Main static site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name octovault.thirdoctopus.com;

    # SSL Certificates (Self-signed initially, then certbot)
    ssl_certificate     /etc/nginx/ssl/octovault/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/octovault/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_VAULT:50m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header X-XSS-Protection "1; mode=block" always;

    # HTTP Basic Auth — protects the admin dashboard and the entire API.
    # Credentials live in .htpasswd-octovault (same conf.d dir, mounted read-only).
    auth_basic           "OctoVault — Authorized Access Only";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd-octovault;

    root /var/www/html/octovault;
    index index.html;

    access_log /var/log/nginx/octovault.access.log;
    error_log  /var/log/nginx/octovault.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # OctoVault Backend API Proxy
    location /api/v1/ {
        proxy_pass http://octovault-app:8080/api/v1/;
        proxy_http_version 1.1;
        # Manual backup syncs scan full mailbox/file history and can exceed
        # nginx's default 60s; allow up to 5 minutes before timing out.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the authenticated Basic-Auth user to the app for truthful audit logs
        proxy_set_header X-Auth-User $remote_user;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

# ---------- HTTP :8086 — IP / Preview listener (also auth-protected) ----------
server {
    listen 8086;
    listen [::]:8086;

    root /var/www/html/octovault;
    index index.html;

    access_log /var/log/nginx/octovault.preview.access.log;
    error_log  /var/log/nginx/octovault.preview.error.log;

    # Same Basic Auth here — this listener proxies the same API and must not
    # be an unauthenticated bypass of the :443 protection.
    auth_basic           "OctoVault — Authorized Access Only";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd-octovault;

    location / {
        try_files $uri $uri/ =404;
    }

    # OctoVault Backend API Proxy
    location /api/v1/ {
        proxy_pass http://octovault-app:8080/api/v1/;
        proxy_http_version 1.1;
        # Manual backup syncs scan full mailbox/file history and can exceed
        # nginx's default 60s; allow up to 5 minutes before timing out.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $remote_user;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
