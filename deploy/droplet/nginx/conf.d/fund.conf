# HCARE Fund Management Portal - fund.thirdoctopus.com

# ---------- HTTP :80 — Redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name fund.thirdoctopus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443 — Production Static App ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fund.thirdoctopus.com;

    ssl_certificate     /etc/nginx/ssl/fund/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/fund/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_FUND:50m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header X-XSS-Protection "1; mode=block" always;

    root /var/www/html/fund;
    index index.html;

    access_log /var/log/nginx/fund.access.log;
    error_log  /var/log/nginx/fund.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA entrypoint must never be cached — hashed assets carry the versioning
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
