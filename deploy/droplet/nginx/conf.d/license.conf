# License Authority — license.thirdoctopus.com
# client → :443 (hrms-nginx) → license-app:8080 (Docker bridge)
upstream license_upstream {
    server license-app:8080;
    keepalive 16;
}
server {
    listen 80;
    listen [::]:80;
    server_name license.thirdoctopus.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name license.thirdoctopus.com;

    ssl_certificate     /etc/nginx/ssl/license/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/license/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_LICENSE:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 16M;
    proxy_read_timeout 60s;
    access_log /var/log/nginx/license.access.log;
    error_log  /var/log/nginx/license.error.log;

    location / {
        proxy_pass http://license_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
