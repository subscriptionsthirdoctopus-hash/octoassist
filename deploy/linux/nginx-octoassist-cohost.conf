# /etc/nginx/sites-available/octoassist
#
# OctoAssist co-host site for the hrms-erp droplet.
# This is ADDED alongside the existing HRMS nginx site — it does NOT replace
# anything. The default site and the HRMS site continue to work as-is.
#
# Internal app: 127.0.0.1:8088 (configurable; see install-cohost.sh).
#
# After laying this file down:
#   sudo ln -sf /etc/nginx/sites-available/octoassist /etc/nginx/sites-enabled/octoassist
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# HTTPS is added in a second pass via certbot:
#   sudo certbot --nginx -d octoassist.thirdoctopus.com
# certbot edits this file in place to add the listen 443 block.

server {
    listen 80;
    listen [::]:80;
    server_name octoassist.thirdoctopus.com;

    # Let's Encrypt http-01 challenge directory (certbot writes here).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 5M;
    proxy_read_timeout 60s;

    access_log /var/log/nginx/octoassist.access.log;
    error_log  /var/log/nginx/octoassist.error.log;

    # Static files served directly from the app dir.
    location /static/ {
        alias /opt/octoassist/app/static/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
