# /etc/nginx/sites-available/octoassist
# Reverse proxy in front of the OctoAssist FastAPI app on 127.0.0.1:8080.
# For production: replace with HTTPS and an internal CA-signed cert.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    client_max_body_size 5M;
    proxy_read_timeout 60s;

    access_log /var/log/nginx/octoassist.access.log;
    error_log  /var/log/nginx/octoassist.error.log;

    location /static/ {
        alias /opt/octoassist/app/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# To enable HTTPS later, add a second server { listen 443 ssl; ... } block
# pointing at the same upstream and put the internal CA cert + key in
# /etc/ssl/octoassist/.
