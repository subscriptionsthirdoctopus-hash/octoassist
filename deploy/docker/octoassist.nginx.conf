# OctoAssist site configuration — DROPPED INTO /opt/hrms-erp/nginx/conf.d/
# on the droplet. Sits alongside the existing hrms.conf as an *additional*
# server block; HRMS is untouched.
#
# octoassist-app is reachable from this container because both containers
# are now joined to the hrms-erp_hrms-network bridge.
#
# HTTP-only for the first cut — HTTPS is added in a second pass once the
# cert is issued (see deploy/docker/issue-cert-octoassist.sh).

upstream octoassist_upstream {
    # Resolves via Docker's embedded DNS in the hrms-erp_hrms-network bridge.
    server octoassist-app:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name octoassist.thirdoctopus.com;

    # Reserve the ACME challenge path for future cert issuance / renewal
    # (webroot mode). The /var/www/certbot dir isn't currently mounted into
    # this nginx, so HTTP-01 challenge will use standalone mode for now.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 5M;
    proxy_read_timeout 60s;

    access_log /var/log/nginx/octoassist.access.log;
    error_log  /var/log/nginx/octoassist.error.log;

    location / {
        proxy_pass http://octoassist_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

