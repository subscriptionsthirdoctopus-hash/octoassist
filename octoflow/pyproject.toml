[project]
name = "octoflow"
version = "0.1.0"
description = "OctoFlow — Time, Timesheet & Time-to-Bill platform for professional services"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "bcrypt>=4.2",
  "cryptography>=43.0",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.5",
  "starlette>=0.41",
  "python-dateutil>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
