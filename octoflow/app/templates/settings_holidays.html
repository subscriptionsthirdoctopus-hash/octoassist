{% extends "base.html" %}
{% block title %}Holidays · Settings{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>Holidays</h1>
    <p class="meta"><a href="/settings" class="weeklink">← Settings</a> · {{ rows|length }} configured</p>
  </div>
</section>

<details class="card" open>
  <summary>➕ Add holiday</summary>
  <form method="post" action="/settings/holidays/new" class="crud-form">
    <div class="grid-2">
      <label>Date<input type="date" name="holiday_date" required></label>
      <label>Name<input type="text" name="name" required maxlength="120" placeholder="e.g. Republic Day"></label>
    </div>
    <div class="form-actions"><button type="submit" class="primary">Add</button></div>
  </form>
</details>

<table class="data">
  <thead><tr><th>Date</th><th>Day</th><th>Name</th><th></th></tr></thead>
  <tbody>
    {% for h in rows %}
    <tr>
      <td>{{ h.holiday_date }}</td>
      <td>{{ h.holiday_date.strftime('%A') }}</td>
      <td>{{ h.name }}</td>
      <td>
        <form method="post" action="/settings/holidays/{{ h.id }}/delete" class="inline-form"
              onsubmit="return confirm('Remove this holiday?');">
          <button type="submit" class="secondary small">Remove</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
